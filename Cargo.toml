[package]
name = "zenith-bound"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Guaranteed-bounds (ball arithmetic) on zenith-float. Pre-release: nothing is guaranteed yet."
publish = false

[dependencies]
# zenith-float pin: rusty/zf-r13 829f112 (R13 directed div/reciprocal/hypot, div_exact; on w6-redo 66040be, i64 Exponent), 2026-10-24.
# ExactNum lives in zenith-float-num. No std feature: zb does not need it. No other dependency is allowed.
zenith-float-num = { git = "https://github.com/jscarr64/zenith-float", rev = "829f112861ea28908053425feb665a75312b4f9f", default-features = false }

# Applies to every target (lib, tests/, benches/, examples/): Jeff's rules hold in test code too.
[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[lints.clippy]
suspicious = { level = "deny", priority = -1 }
float_arithmetic = "deny"
float_cmp = "deny"
cast_precision_loss = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
